name: Rapport EuroMillions

on:
  schedule:
    - cron: '45 4 * * 3'   # Mercredi 4h45 UTC = 6h45 heure de Paris (ete) - apres tirage du mardi soir
    - cron: '45 5 * * 6'   # Samedi 5h45 UTC = 7h45 heure de Paris (ete) - apres tirage du vendredi soir
  workflow_dispatch:        # Declenchement manuel possible

jobs:
  rapport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate & report
        env:
          MAIL_TO:       ${{ secrets.MAIL_TO }}
          MAIL_FROM:     ${{ secrets.MAIL_FROM }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_SMTP:     ${{ secrets.MAIL_SMTP }}
          MAIL_PORT:     ${{ secrets.MAIL_PORT }}
        run: python report.py
